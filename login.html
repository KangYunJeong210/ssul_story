<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>조각글 · 잠금 화면</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#273b36;background:#f7f6f2}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.card{background:#fff;width:min(100%,410px);padding:35px 26px;border:1px solid #e4e9e3;border-radius:22px;box-shadow:0 16px 50px #25483c0d}.brand{font-size:29px;font-weight:800;letter-spacing:-1px}.dot{color:#376d62}h1{font-size:19px;margin:32px 0 10px}.help{color:#75827b;font-size:13px;line-height:1.7;margin-bottom:23px}label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}input{width:100%;border:1px solid #d6dfd9;padding:14px 15px;border-radius:11px;font-size:16px;outline-color:#376d62}button{border:0;width:100%;padding:14px;border-radius:11px;margin-top:14px;background:#376d62;color:white;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#error{color:#b73b39;font-size:12px;min-height:18px;margin-top:13px}small{display:block;margin-top:23px;color:#84928a;font-size:11px;line-height:1.5}</style></head><body><main class="card"><div class="brand">조각글<span class="dot">.</span></div><h1>개인 작업실 잠금</h1><p class="help">설정한 비밀번호를 입력해야 글쓰기 작업실에 들어갈 수 있어요.</p><form id="form"><label for="pin">접속 비밀번호</label><input type="password" id="pin" name="pin" autocomplete="current-password" required autofocus placeholder="Vercel APP_PIN 비밀번호"><button id="submit">잠금 해제</button><p id="error" role="alert"></p></form><small>이 사이트의 기록은 사용하는 휴대폰 브라우저에 저장돼요. 기록 보존을 위해 백업 기능을 이용해 주세요.</small></main><script>
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();let btn=document.querySelector('#submit');let error=document.querySelector('#error');btn.disabled=true;error.textContent='';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.querySelector('#pin').value})});let j=await r.json();if(!r.ok)throw Error(j.error||'인증에 실패했어요.');document.querySelector('#pin').value='';location.replace('/');}catch(e){error.textContent=e.message;}finally{btn.disabled=false;}});
</script></body></html>
