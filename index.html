<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f6f2"><title>조각글 | 나만의 AI 단문 작업실</title><style>

d strong{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:13px}.thread em{display:block;color:var(--muted);font-style:normal;font-size:11px;margin-top:5px}.side-footer{padding:13px 14px;border-top:1px solid var(--line);display:grid;gap:7px}.side-footer .btn{justify-content:flex-start}.main{min-width:0;display:flex;flex-direction:column;height:100dvh}.topbar{height:73px;flex-shrink:0;border-bottom:1px solid var(--line);background:#ffffffc9;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px}.title-wrap{min-width:0}.top-title{font-weight:750;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.subtitle{font-size:11px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.mobile-only{display:none}.chat-viewport{overflow-y:auto;min-height:0;flex:1;scroll-behavior:smooth}.chat-inner{max-width:810px;margin:auto;padding:24px 22px 28px}.welcome{max-width:520px;text-align:center;margin:13vh auto 0}.welcome .mark{font-family:Georgia,serif;font-size:58px;color:var(--accent)}.welcome h1{font-family:Georgia,'Noto Serif KR',serif;font-weight:600;font-size:27px}.welcome p{font-size:14px;color:var(--muted);line-height:1.85}.prompt-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}.chip{border:1px solid #d6e4dc;background:#eff6f1;border-radius:100px;padding:8px 12px;color:#365b51;font-size:12px}.msg{display:flex;margin-bottom:27px;gap:11px;align-items:flex-start}.msg.user{justify-content:flex-end}.bubble{padding:17px 20px;border-radius:17px;background:white;box-shadow:0 2px 14px #24352e0a;max-width:min(94%,720px);font-size:14px;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--accent-soft);border-bottom-right-radius:5px}.ai .bubble{border-bottom-left-radius:5px}.speaker{font-size:10px;font-weight:750;letter-spacing:.1em;color:var(--accent);margin-bottom:7px}.msg-tools{display:flex;gap:7px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}.msg-tools button{font-size:11px;background:#f7f8f6;color:var(--muted);padding:5px 9px;border-radius:7px}.composer-wrap{border-top:1px solid var(--line);background:#fff;padding:13px max(18px,calc((100% - 840px)/2));flex-shrink:0}.composer-options{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}.composer-options label{font-size:11px;color:var(--muted)}.composer-options select,.composer-options input{border:1px solid var(--line);border-radius:9px;padding:7px;background:#fafaf8;color:var(--ink);font-size:12px}.composer-options input{width:75px}.composer{display:flex;align-items:flex-end;gap:9px;background:#f8f8f5;border:1px solid #e5e6df;border-radius:15px;padding:11px}.composer textarea{resize:none;flex:1;min-width:0;background:transparent;border:0;outline:0;padding:4px;min-height:43px;max-height:160px;line-height:1.6;font-size:14px}.send{background:var(--accent);color:white;border-radius:11px;padding:12px 16px;flex-shrink:0;font-weight:700;font-size:12px}.hint{font-size:10px;color:#919492;margin-top:9px;display:flex;justify-content:space-between;gap:8px}.drawer-overlay{display:none}.modal-backdrop{position:fixed;inset:0;background:#101b1a75;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{background:white;border-radius:18px;width:min(100%,540px);max-height:min(88dvh,770px);display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px;border-bottom:1px solid var(--line)}.modal-header h2{font-size:16px;margin:0}.modal-body{overflow:auto;padding:20px;display:grid;gap:15px}.modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}.field-group{display:grid;gap:7px}.field-group label{font-weight:700;font-size:12px}.field-group input,.field-group textarea,.field-group select{width:100%;background:#f9f9f7;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink)}.field-group textarea{min-height:170px;resize:vertical;line-height:1.7}.help{color:var(--muted);font-size:12px;line-height:1.7}.saved-prompt{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:7px}.saved-prompt strong{font-size:13px}.saved-prompt p{margin:0;font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:74px;overflow:hidden}.saved-prompt footer{display:flex;gap:6px;justify-content:flex-end}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#203a34;color:white;border-radius:12px;padding:12px 17px;font-size:12px;box-shadow:var(--shadow);z-index:50;max-width:90vw}.hidden{display:none!important}.empty-note{font-size:12px;color:var(--muted);text-align:center;padding:30px 0}.loading-dots{animation:pulse 1s infinite alternate}@keyframes pulse{from{opacity:.4}to{opacity:1}}@media(max-width:760px){.app{display:block}.sidebar{position:fixed;inset:0 auto 0 0;width:min(85vw,320px);z-index:11;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.drawer-overlay.open{display:block;position:fixed;inset:0;background:#111b1a80;z-index:10}.main{height:100dvh}.mobile-only{display:inline-flex}.topbar{height:65px;padding:0 12px}.top-title{font-size:13px}.actions .btn{padding:8px;font-size:11px}.actions .optional{display:none}.chat-inner{padding:20px 14px}.bubble{max-width:94%;padding:13px 15px;font-size:13px}.composer-wrap{padding:11px 11px max(12px,env(safe-area-inset-bottom))}.composer{padding:8px}.send{padding:12px}.hint{font-size:9px}.welcome{margin-top:10vh}.welcome h1{font-size:23px}.modal{max-height:91dvh}.modal-body{padding:16px}}@media(max-width:390px){.actions .btn span{display:none}.subtitle{display:none}}

</style></head><body><div class="drawer-overlay" id="overlay"></div><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div><b>조각글<span style="color:var(--accent)">.</span></b><small>SHORT STORY STUDIO</small></div><button class="btn small mobile-only" id="closeSide" aria-label="메뉴 닫기">✕</button></div><div class="nav-actions"><button class="btn primary" id="newChat">＋ 새 대화</button><button class="btn" id="promptLibrary">✦ 프롬프트 보관함</button></div><h3>대화 기록</h3><div class="thread-list" id="threads"></div><div class="side-footer"><button class="btn ghost" id="appearance">◐ 화면 설정 · 다크모드 / 글자 크기</button><button class="btn ghost" id="backup">⇩ 전체 데이터 백업</button><button class="btn ghost" id="restore">⇧ 백업 가져오기</button><button class="btn ghost" id="access">⇥ 잠금 / 로그아웃</button><input type="file" id="restoreFile" class="hidden" accept="application/json,.json"></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px;min-width:0"><button class="btn small mobile-only" id="menu" aria-label="메뉴 열기">☰</button><div class="title-wrap"><div class="top-title" id="chatTitle">새로운 이야기</div><div class="subtitle" id="chatMeta">보고 싶은 장면을 입력하면 500자 안팎으로 바로 써드려요</div></div></div><div class="actions"><button class="btn small" id="appearanceTop" title="다크모드와 글자 크기 설정" aria-label="화면 설정">◐ <span>화면</span></button><button class="btn small" id="copyAll">⧉ <span>전체 복사</span></button><button class="btn small optional" id="downloadTxt">⇩ TXT</button><button class="btn small optional" id="renameChat">✎ 제목</button><button class="btn small" id="deleteChat">⋯ <span>삭제</span></button></div></header><section class="chat-viewport" id="viewport"><div class="chat-inner" id="messages"></div></section><section class="composer-wrap"><div class="composer-options"><label for="length">목표 분량</label><input type="number" id="length" min="150" max="1200" step="50" value="500" aria-label="글자 수"><label for="style">문체</label><select id="style"><option>썰처럼 자연스럽게</option><option>담백한 서술</option><option>감정적인 문체</option><option>대사 중심</option><option>긴장감 있는 문체</option><option>몽환적인 문체</option></select><button class="btn small" id="editInstructions">✦ 글쓰기 지침</button></div><div class="composer"><textarea id="input" placeholder="보고 싶은 장면을 적어주세요. 예: 둘이 싸우다가 갑자기 웃음이 터지는 장면…" rows="2"></textarea><button class="send" id="send">보내기 ↗</button></div><div class="hint"><span>Enter 전송 · Shift+Enter 줄바꿈</span><span id="saveStatus">이 기기에 자동 저장됨</span></div></section></main></div><div id="modalRoot"></div><div id="toastRoot"></div><script>
(()=>{'use strict';
const PREF_KEY='itsmine.shortwrite.preferences.v1';
let prefs={theme:'light',fontSize:14};
function applyPrefs(){document.body.dataset.theme=prefs.theme;document.documentElement.style.setProperty('--reading-font-size',prefs.fontSize+'px');const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=prefs.theme==='dark'?'#121716':'#f8f6f2'}
function savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify(prefs))}catch{}applyPrefs()}
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem(PREF_KEY)||'null');if(p){prefs.theme=p.theme==='dark'?'dark':'light';prefs.fontSize=Math.max(12,Math.min(24,Math.round(Number(p.fontSize)||14)))}}catch{}applyPrefs()}
const KEY='itsmine.shortwrite.v1';const $=s=>document.querySelector(s);const el=(tag,cls,text)=>{const a=document.createElement(tag);if(cls)a.className=cls;if(text!==undefined)a.textContent=text;return a};const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2);const stamp=()=>new Date().toISOString();
let data={version:1,chats:[],prompts:[],active:null},busy=false,modal=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));$('#saveStatus').textContent='이 기기에 자동 저장됨'}catch(e){$('#saveStatus').textContent='저장 공간 부족 · 백업 권장';toast('저장하지 못했어요. JSON 백업을 받아주세요.')}}
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&Array.isArray(raw.chats)&&Array.isArray(raw.prompts))data={version:1,chats:raw.chats,prompts:raw.prompts,active:raw.active||null}}catch(e){}if(!data.chats.length)makeChat(false);if(!data.chats.some(c=>c.id===data.active))data.active=data.chats[0].id;persist()}
function current(){return data.chats.find(c=>c.id===data.active)}function niceDate(s){try{return new Date(s).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}catch{return ''}}function toast(t){const r=$('#toastRoot');r.replaceChildren();const div=el('div','toast',t);r.append(div);setTimeout(()=>{if(div.isConnected)div.remove()},3000)}
function makeChat(render=true){const c={id:uid(),title:'새로운 이야기',created:stamp(),updated:stamp(),length:500,style:'썰처럼 자연스럽게',instructions:'',messages:[]};data.chats.unshift(c);data.active=c.id;persist();if(render){closeDrawer();draw()};return c}
function closeDrawer(){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open')};function showDrawer(){$('#sidebar').classList.add('open');$('#overlay').classList.add('open')}
function draw(){drawThreads();drawChat()}
function drawThreads(){const root=$('#threads');root.replaceChildren();for(const c of [...data.chats].sort((a,b)=>(b.updated||'').localeCompare(a.updated||''))){const b=el('button','thread'+(data.active===c.id?' selected':''));const part=el('span');part.append(el('strong','',c.title||'이름 없는 대화'),el('em','',`${niceDate(c.updated)} · ${(c.messages||[]).length}개 메시지`));b.append(part,el('span','',data.active===c.id?'●':'›'));b.onclick=()=>{if(busy)return toast('답변 생성 중에는 대화를 바꿀 수 없어요.');data.active=c.id;persist();closeDrawer();draw()};root.append(b)}}
function drawChat(){const c=current();if(!c)return;$('#chatTitle').textContent=c.title;$('#chatMeta').textContent=`${c.messages.length}개 메시지 · 목표 ${c.length||500}자`;$('#length').value=c.length||500;$('#style').value=c.style||'썰처럼 자연스럽게';const root=$('#messages');root.replaceChildren();if(!c.messages.length){const w=el('div','welcome');w.append(el('div','mark','✧'),el('h1','','이야기의 한 조각을 써볼까요?'),el('p','','보고 싶은 장면을 짧게 적어주세요. 긴 기승전결 없이 원하는 순간부터 바로 써드려요. 마음에 드는 프롬프트는 보관함에 저장할 수 있어요.'));const chips=el('div','prompt-chips');['첫 만남을 500자 썰로','다툰 뒤 화해하는 장면','서늘한 분위기의 반전'].forEach(t=>{const b=el('button','chip',t);b.onclick=()=>{$('#input').value=t;$('#input').focus()};chips.append(b)});w.append(chips);root.append(w)}for(const m of c.messages){const wrap=el('div','msg '+(m.role==='user'?'user':'ai'));const bub=el('div','bubble');bub.append(el('div','speaker',m.role==='user'?'ME':'STORY'),el('div','',m.text||''));const tools=el('div','msg-tools');const cp=el('button','','복사');cp.onclick=()=>copyText(m.text);tools.append(cp);if(m.role==='assistant'){const re=el('button','','다시 생성');re.disabled=busy;re.onclick=()=>regenerate(m.id);tools.append(re)}bub.append(tools);wrap.append(bub);root.append(wrap)}if(busy){const w=el('div','msg ai');const b=el('div','bubble loading-dots','장면을 쓰는 중…');w.append(b);root.append(w)}requestAnimationFrame(()=>{$('#viewport').scrollTop=$('#viewport').scrollHeight})}
function markBusy(v){busy=v;$('#send').disabled=v;$('#send').textContent=v?'작성 중…':'보내기 ↗';$('#newChat').disabled=v;$('#deleteChat').disabled=v;$('#copyAll').disabled=v;$('#renameChat').disabled=v;$('#downloadTxt').disabled=v}
async function requestStory(c,input,hist,continuation=false){const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input,history:hist.map(m=>({role:m.role,text:m.text})),instructions:c.instructions||'',length:c.length||500,style:c.style||'썰처럼 자연스럽게',continuation})});let obj;try{obj=await r.json()}catch{throw Error('서버 응답을 읽을 수 없어요. Vercel 배포를 확인해 주세요.')}if(r.status===401){location.replace('/login.html');throw Error('로그인이 만료됐어요.');}if(!r.ok)throw Error(obj.error||'생성에 실패했어요.');return obj.text}
async function send(){if(busy)return;const txt=$('#input').value.trim();if(!txt)return;const c=current();if(!c)return;const hist=[...c.messages];if(c.messages.length===0&&c.title==='새로운 이야기')c.title=txt.replace(/\s+/g,' ').slice(0,26)||'새로운 이야기';c.messages.push({id:uid(),role:'user',text:txt,at:stamp()});c.updated=stamp();$('#input').value='';persist();markBusy(true);draw();try{const output=await requestStory(c,txt,hist,/이어서|계속|다음 장면/.test(txt));c.messages.push({id:uid(),role:'assistant',text:output,at:stamp()});c.updated=stamp();persist();draw()}catch(e){toast(e.message);draw()}finally{markBusy(false);draw()}}
async function regenerate(id){if(busy)return;const c=current();const idx=c.messages.findIndex(m=>m.id===id);if(idx<1||c.messages[idx].role!=='assistant')return;const prev=c.messages[idx-1];if(prev.role!=='user')return;const hist=c.messages.slice(0,idx-1);markBusy(true);draw();try{const out=await requestStory(c,prev.text,hist,false);c.messages[idx].text=out;c.updated=stamp();persist();toast('답변을 다시 생성했어요.')}catch(e){toast(e.message)}finally{markBusy(false);draw()}}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('텍스트를 복사했어요.')}catch{const ta=el('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'텍스트를 복사했어요.':'복사에 실패했어요. HTTPS 사이트에서 다시 시도해 주세요.')}}
function fullText(c){return [`대화 제목: ${c.title}`,`저장 일시: ${new Date().toLocaleString('ko-KR')}`,'','────────────────────',...c.messages.flatMap(m=>[m.role==='user'?'[나]':'[AI 글]',m.text,''])].join('\n')}
function download(name,text,mime='text/plain;charset=utf-8'){const a=el('a');const u=URL.createObjectURL(new Blob([text],{type:mime}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function showModal(title,build,onSave=null,saveText='저장'){closeModal();const bg=el('div','modal-backdrop');const panel=el('div','modal'),head=el('div','modal-header');head.append(el('h2','',title));const x=el('button','btn small','닫기');x.onclick=closeModal;head.append(x);const body=el('div','modal-body');build(body);const footer=el('div','modal-footer');const cancel=el('button','btn','취소');cancel.onclick=closeModal;footer.append(cancel);if(onSave){const ok=el('button','btn primary',saveText);ok.onclick=()=>onSave(body);footer.append(ok)}panel.append(head,body,footer);bg.append(panel);bg.addEventListener('click',e=>{if(e.target===bg)closeModal()});$('#modalRoot').append(bg);modal=bg;return body}function closeModal(){if(modal)modal.remove();modal=null}
function field(root,label,value='',textarea=false,placeholder=''){const wrap=el('div','field-group');wrap.append(el('label','',label));const x=el(textarea?'textarea':'input');x.value=value;x.placeholder=placeholder;wrap.append(x);root.append(wrap);return x}
function openAppearance(){showModal('화면 설정',root=>{
 const row=el('div','preference-row');row.append(el('label','','화면 테마'));
 const toggle=el('button','btn',prefs.theme==='dark'?'☀ 라이트모드로 전환':'☾ 다크모드로 전환');
 toggle.onclick=()=>{prefs.theme=prefs.theme==='dark'?'light':'dark';savePrefs();toggle.textContent=prefs.theme==='dark'?'☀ 라이트모드로 전환':'☾ 다크모드로 전환'};row.append(toggle);root.append(row);
 const row2=el('div','preference-row');row2.append(el('label','','채팅 글자 크기'));
 const controls=el('div','preference-actions'),minus=el('button','btn preference-step','−'),val=el('span','preference-value',prefs.fontSize+'px'),plus=el('button','btn preference-step','+');
 minus.setAttribute('aria-label','글자 작게');plus.setAttribute('aria-label','글자 크게');
 const update=n=>{prefs.fontSize=Math.max(12,Math.min(24,prefs.fontSize+n));val.textContent=prefs.fontSize+'px';savePrefs()};
 minus.onclick=()=>update(-1);plus.onclick=()=>update(1);controls.append(minus,val,plus);row2.append(controls);root.append(row2);
 root.append(el('p','help','채팅 본문과 입력창 크기를 12~24px 범위에서 조절할 수 있어요. 선택한 테마와 크기는 이 기기에 자동 저장돼요.'));
 });}
function openInstructions(){const c=current();showModal('글쓰기 지침 · 이 채팅에 적용',root=>{const ta=field(root,'AI가 따라야 할 문체 · 구성 · 표현 규칙',c.instructions||'',true,'예: 대사와 지문 비율은 7:3, 서술은 3인칭, 반말 사용…');ta.id='inst';root.append(el('p','help','이 지침은 현재 채팅방에만 적용돼요. 다른 대화에도 쓰려면 프롬프트 보관함에 저장하세요.'))},()=>{c.instructions=$('#inst').value.trim().slice(0,6000);c.updated=stamp();persist();closeModal();toast('이 채팅의 지침을 저장했어요.')})}
function openLibrary(){renderLibrary()}
function renderLibrary(){showModal('저장한 프롬프트',root=>{const add=el('button','btn primary','＋ 새 프롬프트 저장');add.onclick=()=>openPromptEditor();root.append(add);if(!data.prompts.length)root.append(el('p','empty-note','아직 저장한 프롬프트가 없어요.\n좋아하는 문체 지침을 보관해 보세요.'));for(const p of data.prompts){const box=el('article','saved-prompt');box.append(el('strong','',p.title),el('p','',p.text));const foot=el('footer');const use=el('button','btn small primary','이 채팅에 적용');use.onclick=()=>{const c=current();c.instructions=p.text;c.updated=stamp();persist();closeModal();toast(`'${p.title}' 프롬프트를 적용했어요.`)};const edit=el('button','btn small','편집');edit.onclick=()=>openPromptEditor(p);const del=el('button','btn small danger','삭제');del.onclick=()=>{if(!confirm(`'${p.title}' 프롬프트를 삭제할까요?`))return;data.prompts=data.prompts.filter(x=>x.id!==p.id);persist();renderLibrary()};foot.append(use,edit,del);box.append(foot);root.append(box)}})}
function openPromptEditor(p=null){showModal(p?'프롬프트 수정':'새 프롬프트 저장',root=>{const name=field(root,'프롬프트 이름',p?.title||'');name.id='pname';const content=field(root,'프롬프트 내용',p?.text||current().instructions||'',true);content.id='ptext';root.append(el('p','help','한 번 저장하면 다른 대화에서도 바로 불러올 수 있어요.'))},()=>{const title=$('#pname').value.trim(),text=$('#ptext').value.trim();if(!title||!text)return toast('이름과 프롬프트 내용을 입력해 주세요.');if(p){p.title=title;p.text=text}else data.prompts.unshift({id:uid(),title,text});persist();renderLibrary();toast('프롬프트를 저장했어요.')})}
async function openAccess(){if(!confirm('작업실을 잠그고 로그아웃할까요?'))return;await fetch('/api/logout',{method:'POST'});location.replace('/login.html')}
function openRename(){const c=current();showModal('대화 제목 바꾸기',root=>{const x=field(root,'대화 제목',c.title);x.id='rename'},()=>{const n=$('#rename').value.trim();if(!n)return toast('제목을 입력하세요.');c.title=n;c.updated=stamp();persist();closeModal();draw()})}
function removeChat(){if(busy)return;const c=current();if(!confirm(`'${c.title}' 대화를 삭제할까요? 삭제된 기록은 복구할 수 없어요.`))return;data.chats=data.chats.filter(x=>x.id!==c.id);if(!data.chats.length)makeChat(false);data.active=data.chats[0].id;persist();draw()}
function importData(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||!Array.isArray(j.chats)||!Array.isArray(j.prompts))throw Error('올바른 조각글 백업이 아닙니다.');if(!confirm(`기존 기록을 백업 파일로 교체할까요? 현재 대화 ${data.chats.length}개가 덮어써집니다.`))return;data={version:1,chats:j.chats.filter(c=>c&&Array.isArray(c.messages)&&c.id).slice(0,1000),prompts:j.prompts.filter(p=>p&&p.id&&typeof p.text==='string').slice(0,1000),active:j.active};if(!data.chats.length)makeChat(false);if(!data.chats.some(c=>c.id===data.active))data.active=data.chats[0].id;persist();draw();closeDrawer();toast('백업 데이터를 불러왔어요.')}catch(e){toast(e.message||'백업 파일을 읽을 수 없어요.')}};r.readAsText(file)}
$('#appearance').onclick=()=>{closeDrawer();openAppearance()};$('#appearanceTop').onclick=openAppearance;$('#menu').onclick=showDrawer;$('#overlay').onclick=closeDrawer;$('#closeSide').onclick=closeDrawer;$('#newChat').onclick=()=>{if(busy)return;makeChat()};$('#promptLibrary').onclick=openLibrary;$('#editInstructions').onclick=openInstructions;$('#access').onclick=openAccess;$('#renameChat').onclick=openRename;$('#deleteChat').onclick=removeChat;$('#send').onclick=send;$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});$('#length').onchange=e=>{const c=current();c.length=Math.max(150,Math.min(1200,parseInt(e.target.value,10)||500));persist();draw()};$('#style').onchange=e=>{current().style=e.target.value;persist()};$('#copyAll').onclick=()=>{const c=current();if(!c.messages.length)return toast('복사할 대화 기록이 없어요.');copyText(fullText(c))};$('#downloadTxt').onclick=()=>{const c=current();if(!c.messages.length)return toast('저장할 대화가 없어요.');download(`${(c.title||'대화').replace(/[\\/:*?"<>|]/g,'_')}.txt`,fullText(c))};$('#backup').onclick=()=>download(`조각글_백업_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(data,null,2),'application/json');$('#restore').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};loadPrefs();load();draw();
})();
</script></body></html>
